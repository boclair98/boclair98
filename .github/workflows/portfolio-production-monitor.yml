name: Portfolio production monitor

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: portfolio-production-monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discover-services:
    name: Discover GitHub-managed Coders.kr services
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      services: ${{ steps.discover.outputs.services }}
      count: ${{ steps.discover.outputs.count }}
    steps:
      - name: Discover repositories and Coders.kr URLs
        id: discover
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -Eeuo pipefail
          work_dir="$RUNNER_TEMP/coders-service-discovery"
          mkdir -p "$work_dir"

          # --paginate prevents the inventory from silently stopping at the first page.
          gh api --paginate \
            "users/$SOURCE_OWNER/repos?per_page=100&type=owner&sort=updated" \
            > "$work_dir/repository-pages.jsonl"
          jq -s 'add // []' "$work_dir/repository-pages.jsonl" \
            > "$work_dir/repositories.json"
          : > "$work_dir/candidates.jsonl"

          while IFS= read -r repo_json; do
            repo_name="$(jq -r '.name' <<< "$repo_json")"
            is_archived="$(jq -r '.archived // false' <<< "$repo_json")"
            pushed_at="$(jq -r '.pushed_at // ""' <<< "$repo_json")"
            default_branch="$(jq -r '.default_branch // "main"' <<< "$repo_json")"
            homepage="$(jq -r '.homepage // ""' <<< "$repo_json")"

            if [ "$is_archived" = "true" ]; then
              continue
            fi

            # A homepage-only project is discoverable even without a README.
            readme_b64="$(gh api "repos/$SOURCE_OWNER/$repo_name/readme" --jq '.content' 2>/dev/null || true)"
            readme=""
            if [ -n "$readme_b64" ]; then
              readme="$(printf '%s' "$readme_b64" | tr -d '\n' | base64 -d 2>/dev/null || true)"
            fi

            urls="$({
              printf '%s\n' "$homepage"
              printf '%s\n' "$readme"
            } | grep -Eo 'https://[[:alnum:]-]+\.coders\.kr([/?#][^[:space:]<>"]*)?' \
              | sed -E 's/[),.;]+$//' \
              | sort -u || true)"

            while IFS= read -r url; do
              [ -n "$url" ] || continue

              slug="$(printf '%s' "$url" | sed -E 's#https://([^./]+)\.coders\.kr.*#\1#')"
              repo_key="$(printf '%s' "$repo_name" | tr '[:upper:]' '[:lower:]' | tr -cd '[:alnum:]')"
              slug_key="$(printf '%s' "$slug" | tr '[:upper:]' '[:lower:]' | tr -cd '[:alnum:]')"
              homepage_match=0
              name_match=0

              if printf '%s' "$homepage" | grep -Fqi "$slug.coders.kr"; then
                homepage_match=1
              fi
              if [ "$repo_key" = "$slug_key" ]; then
                name_match=1
              fi

              # This is deliberately a candidate inventory. Codex performs the
              # deeper source/deployment/ownership decision before activation.
              # Normalize paths and query strings so one service produces one job.
              confidence=$((homepage_match * 2 + name_match))
              jq -nc \
                --arg repo "$repo_name" \
                --arg repo_url "https://github.com/$SOURCE_OWNER/$repo_name" \
                --arg branch "$default_branch" \
                --arg discovered_url "$url" \
                --arg slug "$slug" \
                --arg pushed_at "$pushed_at" \
                --argjson confidence "$confidence" \
                --argjson homepage_match "$homepage_match" \
                --argjson name_match "$name_match" \
                '{
                  repo: $repo,
                  repo_url: $repo_url,
                  default_branch: $branch,
                  url: ("https://" + $slug + ".coders.kr/"),
                  discovered_url: $discovered_url,
                  slug: $slug,
                  pushed_at: $pushed_at,
                  confidence: $confidence,
                  homepage_match: $homepage_match,
                  name_match: $name_match,
                  state: "candidate"
                }' >> "$work_dir/candidates.jsonl"
            done <<< "$urls"
          done < <(jq -c '.[] | select(.archived != true)' "$work_dir/repositories.json")

          if [ -s "$work_dir/candidates.jsonl" ]; then
            jq -s '
              sort_by([.slug, .confidence, .homepage_match, .name_match, .pushed_at]) |
              group_by(.slug) |
              map(last) |
              sort_by(.repo)
            ' "$work_dir/candidates.jsonl" > "$work_dir/services.json"
          else
            echo '[]' > "$work_dir/services.json"
          fi

          services_json="$(jq -c '.' "$work_dir/services.json")"
          echo "services=$services_json" >> "$GITHUB_OUTPUT"
          echo "count=$(jq 'length' "$work_dir/services.json")" >> "$GITHUB_OUTPUT"

          {
            echo "## Dynamic Coders.kr discovery"
            echo "- GitHub owner: $SOURCE_OWNER"
            echo "- Non-archived repositories scanned: $(jq 'length' "$work_dir/repositories.json")"
            echo "- Coders.kr URL candidates: $(jq 'length' "$work_dir/services.json")"
            echo
            jq -r '.[] | "- \(.repo) → \(.url) [candidate; confidence=\(.confidence)]"' \
              "$work_dir/services.json"
          } >> "$GITHUB_STEP_SUMMARY"

          cp "$work_dir/services.json" "$GITHUB_WORKSPACE/coders-service-discovery.json"

      - name: Upload discovered inventory
        uses: actions/upload-artifact@v4
        with:
          name: coders-service-discovery
          path: coders-service-discovery.json
          if-no-files-found: error
          retention-days: 7

  check-service:
    name: Check ${{ matrix.service.repo }} / ${{ matrix.service.slug }}
    needs: discover-services
    if: needs.discover-services.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.discover-services.outputs.services) }}

    steps:
      - name: Check public service
        env:
          SERVICE_REPOSITORY: ${{ matrix.service.repo }}
          SERVICE_SLUG: ${{ matrix.service.slug }}
          SERVICE_URL: ${{ matrix.service.url }}
        shell: bash
        run: |
          set +e
          result="$(
            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --retry 3 \
              --retry-all-errors \
              --retry-delay 2 \
              --max-time 30 \
              --output /dev/null \
              --write-out 'HTTP %{http_code}; total %{time_total}s' \
              "$SERVICE_URL" 2>&1
          )"
          exit_code=$?
          set -e

          mkdir -p monitor-artifact
          {
            echo "repository=$SERVICE_REPOSITORY"
            echo "slug=$SERVICE_SLUG"
            echo "url=$SERVICE_URL"
            echo "result=$result"
            echo "exit_code=$exit_code"
            echo "checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > monitor-artifact/status.txt

          {
            echo "## $SERVICE_REPOSITORY / $SERVICE_SLUG"
            echo "- URL: $SERVICE_URL"
            echo "- Result: $result"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$exit_code" -ne 0 ]; then
            echo "$SERVICE_REPOSITORY / $SERVICE_SLUG failed: $result" >&2
            exit "$exit_code"
          fi

          echo "$SERVICE_REPOSITORY / $SERVICE_SLUG is reachable: $result"

      - name: Upload lightweight observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-${{ matrix.service.repo }}-${{ matrix.service.slug }}
          path: monitor-artifact/status.txt
          if-no-files-found: ignore
          retention-days: 7
